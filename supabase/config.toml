project_id = "tdw-equipment-manager"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://tdw-equipment-manager-one.vercel.app"
additional_redirect_urls = [
  "https://tdw-equipment-manager-one.vercel.app/auth/callback",
  "https://tdw-equipment-manager-one.vercel.app/auth/set-password",
  "https://tdw-equipment-manager-one.vercel.app/set-password",
  "https://*-tonyle2017.vercel.app/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/set-password",
  "http://localhost:3000/set-password",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/auth/set-password",
  "http://127.0.0.1:3000/set-password"
]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.asset-media]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]
